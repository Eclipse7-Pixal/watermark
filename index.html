<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced WebPDF Watermark Engine</title>
    
    <!-- Modern Standalone CDN Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --bg-base: #090d16;
            --bg-card: #111827;
            --accent-primary: #06b6d4;
            --accent-hover: #0891b2;
            --border-color: #1f2937;
            --text-main: #f9fafb;
            --text-sub: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .app-container {
            width: 100%;
            max-width: 720px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        header {
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        header p {
            color: var(--text-sub);
            font-size: 0.875rem;
            margin-top: 4px;
        }

        .drop-box {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 36px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            background: rgba(255, 255, 255, 0.01);
        }

        .drop-box:hover {
            border-color: var(--accent-primary);
            background: rgba(6, 182, 212, 0.03);
        }

        .drop-box input {
            display: none;
        }

        .drop-title {
            font-size: 0.95rem;
            font-weight: 500;
        }

        .file-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(6, 182, 212, 0.1);
            color: var(--accent-primary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .config-grid {
            display: grid;
            gap: 20px;
            margin: 24px 0;
        }

        .form-control {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-sub);
            font-weight: 600;
        }

        select, input[type="text"], input[type="color"] {
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
        }

        select:focus, input[type="text"]:focus {
            border-color: var(--accent-primary);
        }

        .color-picker-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .color-picker-group input[type="color"] {
            width: 48px;
            height: 42px;
            padding: 2px;
            cursor: pointer;
        }

        .slider-group {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .slider-group input[type="range"] {
            flex: 1;
            accent-color: var(--accent-primary);
        }

        .action-btn {
            background: var(--accent-primary);
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            transition: background 0.2s;
        }

        .action-btn:hover {
            background: var(--accent-hover);
        }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .progress-status {
            margin-top: 16px;
            font-size: 0.85rem;
            text-align: center;
            color: var(--text-sub);
            min-height: 20px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>Advanced PDF Watermark Stripper</h1>
            <p>Engine powered by stream operator parsing and RGB delta masking.</p>
        </header>

        <div class="drop-box" id="dropArea" onclick="document.getElementById('pdfInput').click()">
            <span id="dropPrompt" class="drop-title">Select or Drop Target PDF File</span>
            <div id="fileInfo" class="file-badge hidden"></div>
            <input type="file" id="pdfInput" accept="application/pdf">
        </div>

        <div class="config-grid">
            <div class="form-control">
                <label for="engineMode">Processing Architecture</label>
                <select id="engineMode">
                    <option value="stream">Stream Parsing Mode (Cleanest: Text, Fonts & Vectors)</option>
                    <option value="chroma">Color Isolation Mode (Scanned/Flattened PDFs)</option>
                </select>
            </div>

            <!-- Stream Mode Controls -->
            <div id="streamControls" class="form-control">
                <label for="textMatch">Watermark Keyword Pattern</label>
                <input type="text" id="textMatch" placeholder="Exact string, e.g., CONFIDENTIAL or Sample">
            </div>

            <!-- Chroma/Raster Mode Controls -->
            <div id="chromaControls" class="form-control hidden">
                <label>Target Watermark Color & Tolerance Delta</label>
                <div class="color-picker-group">
                    <input type="color" id="watermarkColor" value="#cccccc">
                    <div class="slider-group" style="flex:1;">
                        <input type="range" id="colorTolerance" min="5" max="150" value="40">
                        <span id="toleranceValue" style="font-size:0.85rem;">40</span>
                    </div>
                </div>
            </div>
        </div>

        <button id="executeBtn" class="action-btn" disabled>Strip Watermark & Export</button>
        <div id="statusBox" class="progress-status"></div>
    </div>

    <script>
        // Set worker location for PDF.js engine
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let activeFile = null;

        // UI Binding
        const pdfInput = document.getElementById('pdfInput');
        const dropArea = document.getElementById('dropArea');
        const dropPrompt = document.getElementById('dropPrompt');
        const fileInfo = document.getElementById('fileInfo');
        const engineMode = document.getElementById('engineMode');
        const streamControls = document.getElementById('streamControls');
        const chromaControls = document.getElementById('chromaControls');
        const textMatch = document.getElementById('textMatch');
        const watermarkColor = document.getElementById('watermarkColor');
        const colorTolerance = document.getElementById('colorTolerance');
        const toleranceValue = document.getElementById('toleranceValue');
        const executeBtn = document.getElementById('executeBtn');
        const statusBox = document.getElementById('statusBox');

        // Dynamic Panel Switcher
        engineMode.addEventListener('change', () => {
            if (engineMode.value === 'stream') {
                streamControls.classList.remove('hidden');
                chromaControls.classList.add('hidden');
            } else {
                streamControls.classList.add('hidden');
                chromaControls.classList.remove('hidden');
            }
        });

        colorTolerance.addEventListener('input', () => {
            toleranceValue.textContent = colorTolerance.value;
        });

        // File Handler
        pdfInput.addEventListener('change', (e) => handleFileSelection(e.target.files));
        
        dropArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropArea.style.borderColor = 'var(--accent-primary)';
        });

        dropArea.addEventListener('dragleave', () => {
            dropArea.style.borderColor = 'var(--border-color)';
        });

        dropArea.addEventListener('drop', (e) => {
            e.preventDefault();
            dropArea.style.borderColor = 'var(--border-color)';
            handleFileSelection(e.dataTransfer.files);
        });

        function handleFileSelection(files) {
            if (files.length && files[0].type === 'application/pdf') {
                activeFile = files[0];
                dropPrompt.classList.add('hidden');
                fileInfo.classList.remove('hidden');
                fileInfo.textContent = `PDF Loaded: ${activeFile.name}`;
                executeBtn.disabled = false;
            }
        }

        // Processing Pipeline Dispatcher
        executeBtn.addEventListener('click', async () => {
            if (!activeFile) return;

            executeBtn.disabled = true;
            statusBox.textContent = "Initializing PDF AST Parser...";

            try {
                const buffer = await activeFile.arrayBuffer();
                if (engineMode.value === 'stream') {
                    await processStreamExtraction(buffer);
                } else {
                    await processChromaFiltering(buffer);
                }
            } catch (error) {
                console.error(error);
                statusBox.textContent = "Error executing process: Check browser console.";
            } finally {
                executeBtn.disabled = false;
            }
        });

        // 1. Direct Content Stream AST Vector Stripper
        async function processStreamExtraction(arrayBuffer) {
            const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer);
            const targetPhrase = textMatch.value.trim();

            if (!targetPhrase) {
                statusBox.textContent = "Enter a keyword pattern to remove.";
                return;
            }

            const pages = pdfDoc.getPages();
            let matchesFound = 0;

            pages.forEach((page) => {
                const { Contents } = page.node.NormalizedEntries();
                if (!Contents) return;

                const streams = Array.isArray(Contents) ? Contents : [Contents];

                streams.forEach(stream => {
                    let rawBytes = stream.getUncompressedEncodedBytes();
                    let streamText = new TextDecoder('latin1').decode(rawBytes);

                    if (streamText.includes(targetPhrase)) {
                        matchesFound++;
                        // Target PDF string placement operators (Tj, TJ, ')
                        const pattern = new RegExp(`\\([^\\)]*${targetPhrase}[^\\)]*\\)\\s*(T[jJ]|\\')`, 'g');
                        const sanitizedStream = streamText.replace(pattern, '() Tj');
                        
                        stream.data = new TextEncoder().encode(sanitizedStream);
                    }
                });
            });

            const processedPdf = await pdfDoc.save();
            triggerDownload(processedPdf, "stream_cleaned.pdf");
            statusBox.textContent = `Completed! Removed ${matchesFound} instances.`;
        }

        // 2. RGB Distance Chroma Filter (Color Masking)
        async function processChromaFiltering(arrayBuffer) {
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            const totalPages = pdf.numPages;
            
            // Convert Hex Color Target to RGB
            const targetHex = watermarkColor.value;
            const targetR = parseInt(targetHex.slice(1, 3), 16);
            const targetG = parseInt(targetHex.slice(3, 5), 16);
            const targetB = parseInt(targetHex.slice(5, 7), 16);
            const maxDelta = parseFloat(colorTolerance.value);

            const { jsPDF } = window.jspdf;
            let exportDoc = null;

            for (let i = 1; i <= totalPages; i++) {
                statusBox.textContent = `Rasterizing page ${i} of ${totalPages}...`;

                const page = await pdf.getPage(i);
                const viewport = page.getViewport({ scale: 2.0 });

                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = viewport.width;
                canvas.height = viewport.height;

                await page.render({ canvasContext: ctx, viewport }).promise;

                // Extract & Mutate Frame Memory
                const frameData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const pixels = frameData.data;

                for (let px = 0; px < pixels.length; px += 4) {
                    const r = pixels[px];
                    const g = pixels[px + 1];
                    const b = pixels[px + 2];

                    // Compute Euclidean distance in RGB color space
                    const distance = Math.sqrt(
                        Math.pow(r - targetR, 2) +
                        Math.pow(g - targetG, 2) +
                        Math.pow(b - targetB, 2)
                    );

                    // Neutralize target watermark color to pure white
                    if (distance <= maxDelta) {
                        pixels[px] = 255;
                        pixels[px + 1] = 255;
                        pixels[px + 2] = 255;
                    }
                }

                ctx.putImageData(frameData, 0, 0);

                const pageImgData = canvas.toDataURL('image/jpeg', 0.90);
                const pageW = viewport.width * 0.75;
                const pageH = viewport.height * 0.75;

                if (i === 1) {
                    exportDoc = new jsPDF({
                        orientation: pageW > pageH ? 'l' : 'p',
                        unit: 'pt',
                        format: [pageW, pageH]
                    });
                } else {
                    exportDoc.addPage([pageW, pageH], pageW > pageH ? 'l' : 'p');
                }

                exportDoc.addImage(pageImgData, 'JPEG', 0, 0, pageW, pageH);
            }

            const pdfBytes = exportDoc.output('arraybuffer');
            triggerDownload(pdfBytes, "chroma_cleaned.pdf");
            statusBox.textContent = "Color-filtered export completed!";
        }

        // File Save Utility
        function triggerDownload(buffer, name) {
            const blob = new Blob([buffer], { type: 'application/pdf' });
            const downloadUrl = URL.createObjectURL(blob);
            const anchor = document.createElement('a');
            anchor.href = downloadUrl;
            anchor.download = name;
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
            URL.revokeObjectURL(downloadUrl);
        }
    </script>
</body>
</html>
