<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI PDF Watermark Stripper Pro</title>
    
    <!-- Production Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <style>
        :root {
            --bg: #0b0f19;
            --panel: #151d2a;
            --panel-border: #232d3f;
            --accent: #00f2fe;
            --accent-dim: rgba(0, 242, 254, 0.12);
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --success: #2ed573;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: var(--panel);
            border-bottom: 1px solid var(--panel-border);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-title {
            font-size: 1.2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge {
            background: var(--accent-dim);
            color: var(--accent);
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--accent);
        }

        .app-layout {
            display: grid;
            grid-template-columns: 380px 1fr;
            flex: 1;
            height: calc(100vh - 65px);
        }

        .sidebar {
            background: var(--panel);
            border-right: 1px solid var(--panel-border);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .drop-box {
            border: 2px dashed var(--panel-border);
            border-radius: 8px;
            padding: 24px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .drop-box:hover {
            border-color: var(--accent);
            background: var(--accent-dim);
        }

        .drop-box input { display: none; }

        .section-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-sub);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .progress-box {
            background: var(--bg);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 14px;
        }

        .timer-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: var(--panel-border);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: var(--accent);
            transition: width 0.1s linear;
        }

        .detected-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
        }

        .detected-card {
            background: var(--bg);
            border: 1px solid var(--panel-border);
            padding: 10px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
        }

        .btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }

        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .workspace {
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            background: #070a10;
        }

        .canvas-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 4px;
            overflow: hidden;
        }

        canvas { display: block; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <div class="logo-title">
            <span>AI PDF Watermark Stripper</span>
            <span class="badge">PRO ENGINE</span>
        </div>
        <div id="fileBadge" style="font-size:0.85rem; color: var(--text-sub);">No PDF Loaded</div>
    </header>

    <div class="app-layout">
        <div class="sidebar">
            <div>
                <div class="section-title">Source File</div>
                <div class="drop-box" id="dropArea" onclick="document.getElementById('pdfInput').click()">
                    <span id="dropText">Click or Drop PDF Here</span>
                    <input type="file" id="pdfInput" accept="application/pdf">
                </div>
            </div>

            <button id="scanBtn" class="btn" disabled>Scan & Detect Watermarks</button>

            <!-- Progress Meter & Countdown Widget -->
            <div id="progressWidget" class="progress-box hidden">
                <div class="timer-display">
                    <span id="statusLabel">Initializing...</span>
                    <span id="timeRemaining">--:--</span>
                </div>
                <div class="progress-bar-bg">
                    <div id="progressFill" class="progress-bar-fill"></div>
                </div>
            </div>

            <div id="detectionPanel" class="hidden">
                <div class="section-title">Detected Watermark Patterns</div>
                <div id="detectedList" class="detected-list"></div>
            </div>

            <div style="margin-top: auto;">
                <button id="processBtn" class="btn" style="background: var(--success); color: #fff;" disabled>Strip & Export 100% Original Quality</button>
            </div>
        </div>

        <div class="workspace">
            <div class="canvas-container">
                <canvas id="pdfCanvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let rawBuffer = null;
        let pdfDocLib = null;
        let pdfDocJs = null;
        let selectedPatterns = new Set();

        const pdfInput = document.getElementById('pdfInput');
        const dropText = document.getElementById('dropText');
        const fileBadge = document.getElementById('fileBadge');
        const scanBtn = document.getElementById('scanBtn');
        const processBtn = document.getElementById('processBtn');
        const progressWidget = document.getElementById('progressWidget');
        const statusLabel = document.getElementById('statusLabel');
        const timeRemaining = document.getElementById('timeRemaining');
        const progressFill = document.getElementById('progressFill');
        const detectionPanel = document.getElementById('detectionPanel');
        const detectedList = document.getElementById('detectedList');
        const pdfCanvas = document.getElementById('pdfCanvas');

        pdfInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

        async function handleFile(file) {
            if (!file || file.type !== 'application/pdf') return;

            dropText.textContent = file.name;
            fileBadge.textContent = `${file.name} (${(file.size/1024/1024).toFixed(2)} MB)`;

            rawBuffer = await file.arrayBuffer();
            pdfDocLib = await PDFLib.PDFDocument.load(rawBuffer.slice(0), { ignoreEncryption: true });
            pdfDocJs = await pdfjsLib.getDocument({ data: rawBuffer.slice(0) }).promise;

            scanBtn.disabled = false;
            renderPreview(1);
        }

        async function renderPreview(pageNum) {
            const page = await pdfDocJs.getPage(pageNum);
            const viewport = page.getViewport({ scale: 1.2 });
            
            pdfCanvas.width = viewport.width;
            pdfCanvas.height = viewport.height;

            const ctx = pdfCanvas.getContext('2d');
            await page.render({ canvasContext: ctx, viewport }).promise;
        }

        // SAFE ASYNC SCANNING ENGINE USING PDF.JS
        scanBtn.addEventListener('click', async () => {
            scanBtn.disabled = true;
            progressWidget.classList.remove('hidden');
            detectionPanel.classList.add('hidden');
            detectedList.innerHTML = '';
            selectedPatterns.clear();

            const totalPages = pdfDocJs.numPages;
            const frequencyMap = new Map();
            let startTime = Date.now();

            for (let i = 1; i <= totalPages; i++) {
                try {
                    const page = await pdfDocJs.getPage(i);
                    const textContent = await page.getTextContent();

                    textContent.items.forEach(item => {
                        const str = item.str.trim();
                        if (str.length > 2) {
                            frequencyMap.set(str, (frequencyMap.get(str) || 0) + 1);
                        }
                    });
                } catch (err) {
                    console.warn(`Skipped unreadable stream on page ${i}:`, err);
                }

                // Update Countdown & Progress Meter
                let percent = Math.round((i / totalPages) * 100);
                let elapsedMs = Date.now() - startTime;
                let remainingMs = Math.max(0, Math.round((elapsedMs / i) * (totalPages - i)));
                
                let remSecs = Math.ceil(remainingMs / 1000);
                let mins = Math.floor(remSecs / 60);
                let secs = remSecs % 60;

                progressFill.style.width = `${percent}%`;
                statusLabel.textContent = `Scanning ${i}/${totalPages} Pages...`;
                timeRemaining.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

                // Force UI tick update
                await new Promise(r => setTimeout(r, 0));
            }

            // Filter auto-detected watermarks across pages (35%+ presence)
            const threshold = Math.max(1, Math.floor(totalPages * 0.35));
            frequencyMap.forEach((count, text) => {
                if (count >= threshold) {
                    selectedPatterns.add(text);
                    const card = document.createElement('div');
                    card.className = 'detected-card';
                    card.innerHTML = `
                        <div>
                            <strong>"${text}"</strong>
                            <div style="font-size:0.75rem; color:var(--text-sub);">${count}/${totalPages} pages</div>
                        </div>
                        <input type="checkbox" checked>
                    `;
                    card.querySelector('input').addEventListener('change', (e) => {
                        if (e.target.checked) selectedPatterns.add(text);
                        else selectedPatterns.delete(text);
                    });
                    detectedList.appendChild(card);
                }
            });

            progressWidget.classList.add('hidden');
            detectionPanel.classList.remove('hidden');
            scanBtn.disabled = false;
            processBtn.disabled = false;
        });

        // 100% VECTOR EXPORT
        processBtn.addEventListener('click', async () => {
            if (selectedPatterns.size === 0) return;

            processBtn.disabled = true;
            statusLabel.textContent = "Stripping watermark stream...";
            progressWidget.classList.remove('hidden');
            progressFill.style.width = "50%";
            timeRemaining.textContent = "00:05";

            await new Promise(r => setTimeout(r, 50));

            const pages = pdfDocLib.getPages();

            pages.forEach((page) => {
                try {
                    const { Contents } = page.node.NormalizedEntries();
                    if (!Contents) return;

                    const streams = Array.isArray(Contents) ? Contents : [Contents];
                    streams.forEach(stream => {
                        let rawBytes = stream.getUncompressedEncodedBytes();
                        let streamText = new TextDecoder('latin1').decode(rawBytes);

                        selectedPatterns.forEach(pattern => {
                            const escaped = pattern.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                            const regex = new RegExp(`\\([^\\)]*${escaped}[^\\)]*\\)\\s*(T[jJ]|\\')`, 'g');
                            streamText = streamText.replace(regex, '() Tj');
                        });

                        stream.data = new TextEncoder().encode(streamText);
                    });
                } catch (e) {
                    console.warn("Could not modify low-level stream on page:", e);
                }
            });

            progressFill.style.width = "100%";
            const cleanedPdfBytes = await pdfDocLib.save();

            const blob = new Blob([cleanedPdfBytes], { type: 'application/pdf' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = "original_quality_cleaned.pdf";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            progressWidget.classList.add('hidden');
            processBtn.disabled = false;
        });
    </script>
</body>
</html>
