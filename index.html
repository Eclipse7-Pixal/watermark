<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Powered PDF Watermark Remover Pro</title>
    
    <!-- Production Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <style>
        :root {
            --bg: #0b0f19;
            --panel: #151d2a;
            --panel-border: #232d3f;
            --accent: #00f2fe;
            --accent-dim: rgba(0, 242, 254, 0.15);
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --danger: #ff4757;
            --success: #2ed573;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: var(--panel);
            border-bottom: 1px solid var(--panel-border);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-title {
            font-size: 1.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge {
            background: var(--accent-dim);
            color: var(--accent);
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
            border: 1px solid var(--accent);
        }

        .app-layout {
            display: grid;
            grid-template-columns: 360px 1fr;
            flex: 1;
            height: calc(100vh - 65px);
        }

        /* Sidebar Controls */
        .sidebar {
            background: var(--panel);
            border-right: 1px solid var(--panel-border);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .drop-box {
            border: 2px dashed var(--panel-border);
            border-radius: 8px;
            padding: 28px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: rgba(255, 255, 255, 0.01);
        }

        .drop-box:hover {
            border-color: var(--accent);
            background: var(--accent-dim);
        }

        .drop-box input { display: none; }

        .section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-sub);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .detected-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 220px;
            overflow-y: auto;
        }

        .detected-card {
            background: var(--bg);
            border: 1px solid var(--panel-border);
            padding: 12px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
        }

        .detected-card.active {
            border-color: var(--accent);
        }

        .btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.9; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Preview Workspace */
        .workspace {
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            background: #070a10;
        }

        .canvas-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }

        canvas { display: block; }

        /* Bounding Box Overlay */
        .selection-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: auto;
            cursor: crosshair;
        }

        .status-bar {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-top: 8px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <div class="logo-title">
            <span>AI PDF Watermark Stripper</span>
            <span class="badge">PRO ENGINE</span>
        </div>
        <div id="fileBadge" class="status-bar">No PDF Loaded</div>
    </header>

    <div class="app-layout">
        <!-- Control Panel -->
        <div class="sidebar">
            <div>
                <div class="section-title">Source File</div>
                <div class="drop-box" id="dropArea" onclick="document.getElementById('pdfInput').click()">
                    <span id="dropText">Click or Drop PDF Here</span>
                    <input type="file" id="pdfInput" accept="application/pdf">
                </div>
            </div>

            <div>
                <button id="scanBtn" class="btn" disabled>Scan & Detect Watermarks</button>
            </div>

            <div id="detectionPanel" class="hidden">
                <div class="section-title">Detected Auto-Patterns</div>
                <div id="detectedList" class="detected-list"></div>
            </div>

            <div style="margin-top: auto;">
                <button id="processBtn" class="btn" style="background: var(--success); color: #fff;" disabled>Strip & Export PDF</button>
            </div>
            <div id="statusText" class="status-bar"></div>
        </div>

        <!-- Document Preview Canvas -->
        <div class="workspace">
            <div id="pageNav" class="status-bar hidden">Showing Page 1 Preview</div>
            <div class="canvas-container" id="canvasContainer">
                <canvas id="pdfCanvas"></canvas>
                <div class="selection-layer" id="selectionLayer"></div>
            </div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let rawBuffer = null;
        let pdfDocLib = null;
        let pdfDocJs = null;
        let detectedPatterns = [];
        let selectedPatterns = new Set();

        // UI Binding
        const pdfInput = document.getElementById('pdfInput');
        const dropArea = document.getElementById('dropArea');
        const dropText = document.getElementById('dropText');
        const fileBadge = document.getElementById('fileBadge');
        const scanBtn = document.getElementById('scanBtn');
        const processBtn = document.getElementById('processBtn');
        const detectionPanel = document.getElementById('detectionPanel');
        const detectedList = document.getElementById('detectedList');
        const statusText = document.getElementById('statusText');
        const pdfCanvas = document.getElementById('pdfCanvas');
        const pageNav = document.getElementById('pageNav');

        pdfInput.addEventListener('change', (e) => handleFile(e.target.files[0]));
        
        dropArea.addEventListener('dragover', (e) => { e.preventDefault(); dropArea.style.borderColor = 'var(--accent)'; });
        dropArea.addEventListener('dragleave', () => { dropArea.style.borderColor = 'var(--panel-border)'; });
        dropArea.addEventListener('drop', (e) => {
            e.preventDefault();
            dropArea.style.borderColor = 'var(--panel-border)';
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });

        async function handleFile(file) {
            if (!file || file.type !== 'application/pdf') return;

            dropText.textContent = file.name;
            fileBadge.textContent = `${file.name} (${(file.size/1024/1024).toFixed(2)} MB)`;
            statusText.textContent = "Loading document memory...";

            rawBuffer = await file.arrayBuffer();
            pdfDocLib = await PDFLib.PDFDocument.load(rawBuffer, { ignoreEncryption: true });
            pdfDocJs = await pdfjsLib.getDocument({ data: rawBuffer.slice(0) }).promise;

            scanBtn.disabled = false;
            statusText.textContent = "PDF Loaded. Click 'Scan & Detect' to analyze.";
            
            // Render first page preview
            renderPreview(1);
        }

        // Render Page Canvas
        async function renderPreview(pageNum) {
            const page = await pdfDocJs.getPage(pageNum);
            const viewport = page.getViewport({ scale: 1.2 });
            
            pdfCanvas.width = viewport.width;
            pdfCanvas.height = viewport.height;

            const ctx = pdfCanvas.getContext('2d');
            await page.render({ canvasContext: ctx, viewport }).promise;
            pageNav.classList.remove('hidden');
        }

        // AUTO-DETECTION ENGINE (Pattern Matching across pages)
        scanBtn.addEventListener('click', async () => {
            scanBtn.disabled = true;
            statusText.textContent = "Scanning multi-page stream patterns...";
            detectedPatterns = [];
            selectedPatterns.clear();
            detectedList.innerHTML = '';

            const pages = pdfDocLib.getPages();
            const totalPages = pages.length;
            const frequencyMap = new Map();

            // Frequency Analysis across page streams
            pages.forEach((page, pIdx) => {
                const { Contents } = page.node.NormalizedEntries();
                if (!Contents) return;

                const streams = Array.isArray(Contents) ? Contents : [Contents];

                streams.forEach(stream => {
                    const rawBytes = stream.getUncompressedEncodedBytes();
                    const text = new TextDecoder('latin1').decode(rawBytes);

                    // Extract text strings inside PDF TJ/Tj operators
                    const stringMatches = text.match(/\(([^)]+)\)\s*T[jJ]/g);
                    if (stringMatches) {
                        stringMatches.forEach(match => {
                            const cleanText = match.replace(/\((.*)\)\s*T[jJ]/, '$1').trim();
                            if (cleanText.length > 2) {
                                const count = frequencyMap.get(cleanText) || 0;
                                frequencyMap.set(cleanText, count + 1);
                            }
                        });
                    }
                });
            });

            // Filter elements appearing across at least 50% of the document pages
            const threshold = Math.max(1, Math.floor(totalPages * 0.5));
            frequencyMap.forEach((count, text) => {
                if (count >= threshold) {
                    detectedPatterns.push({ type: 'Text Vector', pattern: text, occurrences: count });
                }
            });

            // Display Results
            if (detectedPatterns.length > 0) {
                detectionPanel.classList.remove('hidden');
                detectedPatterns.forEach((item, index) => {
                    selectedPatterns.add(item.pattern); // Selected by default

                    const card = document.createElement('div');
                    card.className = 'detected-card active';
                    card.innerHTML = `
                        <div>
                            <strong>"${item.pattern}"</strong>
                            <div style="font-size: 0.75rem; color: var(--text-sub);">${item.type} • ${item.occurrences}/${totalPages} pages</div>
                        </div>
                        <input type="checkbox" checked data-index="${index}">
                    `;

                    card.querySelector('input').addEventListener('change', (e) => {
                        if (e.target.checked) {
                            selectedPatterns.add(item.pattern);
                            card.classList.add('active');
                        } else {
                            selectedPatterns.delete(item.pattern);
                            card.classList.remove('active');
                        }
                    });

                    detectedList.appendChild(card);
                });

                statusText.textContent = `Auto-detected ${detectedPatterns.length} potential watermark(s).`;
                processBtn.disabled = false;
            } else {
                statusText.textContent = "No repeating structural watermarks found.";
            }

            scanBtn.disabled = false;
        });

        // EXECUTION & STRIPPING ENGINE
        processBtn.addEventListener('click', async () => {
            if (selectedPatterns.size === 0) {
                statusText.textContent = "Select at least one pattern to strip.";
                return;
            }

            processBtn.disabled = true;
            statusText.textContent = "Stripping watermark streams and re-assembling PDF...";

            const pages = pdfDocLib.getPages();

            pages.forEach((page) => {
                const { Contents } = page.node.NormalizedEntries();
                if (!Contents) return;

                const streams = Array.isArray(Contents) ? Contents : [Contents];

                streams.forEach(stream => {
                    let rawBytes = stream.getUncompressedEncodedBytes();
                    let streamText = new TextDecoder('latin1').decode(rawBytes);

                    selectedPatterns.forEach(pattern => {
                        // Strip matching text operators
                        const regex = new RegExp(`\\([^\\)]*${escapeRegExp(pattern)}[^\\)]*\\)\\s*(T[jJ]|\\')`, 'g');
                        streamText = streamText.replace(regex, '() Tj');
                    });

                    stream.data = new TextEncoder().encode(streamText);
                });
            });

            const cleanedPdfBytes = await pdfDocLib.save();
            downloadPdf(cleanedPdfBytes, "ai_cleaned_document.pdf");

            statusText.textContent = "Watermark removal complete! File downloaded.";
            processBtn.disabled = false;
        });

        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function downloadPdf(buffer, filename) {
            const blob = new Blob([buffer], { type: 'application/pdf' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
